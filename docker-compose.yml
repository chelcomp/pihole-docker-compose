version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: 'America/Sao_Paulo'
      # It is recommended to set a password. 
      # Please change 'YourPassword' for a secure password.
      FTLCONF_webserver_api_password: 'myfirst'
      FTLCONF_dns_listeningMode: 'all'

      #FTLCONF_dns_revServers: 'true,10.1.1.0/24,10.1.1.1,lan'
      FTLCONF_dns_upstreams: '1.1.1.3;1.0.0.3'
      #FTLCONF_webserver_port: '8082,443s'
      #FTLCONF_debug_api: 'true'
      FTLCONF_misc_etc_dnsmasq_d: true
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './adlists.list:/etc/pihole/adlists.list'
    cap_add:
      - CAP_NET_ADMIN
      - CAP_SYS_NICE
      - CAP_SYS_TIME
      - CAP_CHOWN
    restart: unless-stopped

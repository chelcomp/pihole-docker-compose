version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: 'America/Sao_Paulo'
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_dns_upstreams: '1.1.1.3;1.0.0.3'
      FTLCONF_misc_etc_dnsmasq_d: true
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './adlists.list:/etc/pihole/adlists.list'
    cap_add:
      - CAP_NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 localhost +short || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"